name: Build and Release Standalone Packages

on:
  push:
    branches: [ main ]
    tags:
      - "v*"
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux Standalone (x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential qt6-base-dev libqt6svg6-dev libasound2-dev zip

      - name: Build and Package Standalone Bundle
        run: |
          chmod +x scripts/package_release.sh
          ./scripts/package_release.sh

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MIDI2Bridge-Linux-x86_64
          path: |
            dist/*.tar.gz
            dist/*.zip

  build-windows:
    name: Build Windows Standalone (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup MSVC Compiler
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.2"
          target: "desktop"
          arch: "win64_msvc2022_64"
          modules: "qtsvg"

      - name: Build and Package with PowerShell
        shell: pwsh
        run: |
          ./scripts/package_windows.ps1

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MIDI2Bridge-Windows-x64
          path: dist/*.zip

  create-release:
    name: Publish GitHub Release
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, "refs/tags/v")
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: MIDI2Bridge-Linux-x86_64
          path: release-assets/

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: MIDI2Bridge-Windows-x64
          path: release-assets/

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
